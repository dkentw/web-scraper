[project]
name = "web-scraper"
version = "0.1.0"
description = "A web scraper supporting static HTML and dynamic browser-based scraping"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "beautifulsoup4",
    "playwright",
    "lxml",
    "selectolax>=0.4.6",
    "pyyaml>=6.0.3",
    "colorama>=0.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
